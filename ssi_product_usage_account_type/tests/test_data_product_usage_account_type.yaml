  - name: "Product Usage Type - Get account resolution from usage type fallback"
    steps:
      - step: "Search for existing account type"
        action: "search"
        model: "account.account.type"
        save_as: "account_type"
        domain:
          - - "type"
            - "="
            - "other"
        limit: 1

      - step: "Create account"
        action: "create"
        model: "account.account"
        save_as: "account"
        values:
          name: "Fallback Account"
          code: "999005"
          user_type_id: "EVAL: registry['account_type'].id"

      - step: "Create product usage type with account"
        action: "create"
        model: "product.usage_type"
        save_as: "usage_type"
        values:
          name: "Fallback Usage"
          code: "FALLB"
          account_id: "EVAL: registry['account'].id"

      - step: "Assert usage type has account"
        action: "assert"
        target: "usage_type"
        asserts:
          account_id:
            type: "value"
            operator: "is_truthy"

      - step: "Create product template"
        action: "create"
        model: "product.template"
        save_as: "product_tmpl"
        values:
          name: "Product Fallback Test"
          type: "consu"

      - step: "Get product variant"
        action: "search"
        model: "product.product"
        save_as: "product"
        domain:
          - - "name"
            - "="
            - "Product Fallback Test"
        limit: 1

      - step: "Call _get_product_account on product"
        action: "call"
        target: "product"
        method: "_get_product_account"
        args:
          - "FALLB"

      - step: "Call _get_product_tax on product"
        action: "call"
        target: "product"
        method: "_get_product_tax"
        args:
          - "FALLB"
