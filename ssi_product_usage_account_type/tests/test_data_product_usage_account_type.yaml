scenarios:
  - name: "Product Usage Type - Create and verify basic data"
    steps:
      - step: "Search for existing account type"
        action: "search"
        model: "account.account.type"
        save_as: "account_type"
        domain:
          - - "type"
            - "="
            - "other"
        limit: 1

      - step: "Create account for usage type"
        action: "create"
        model: "account.account"
        save_as: "account"
        values:
          name: "Test Usage Account"
          code: "999001"
          user_type_id: "EVAL: registry['account_type'].id"

      - step: "Create product usage type"
        action: "create"
        model: "product.usage_type"
        save_as: "usage_type"
        values:
          name: "Test Usage Type"
          code: "TUT001"
          account_id: "EVAL: registry['account'].id"

      - step: "Assert usage type created"
        action: "assert"
        target: "usage_type"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          name:
            type: "value"
            expected: "Test Usage Type"
          code:
            type: "value"
            expected: "TUT001"
          selection_method:
            type: "value"
            expected: "fixed"

  - name: "Product Usage Type - Product account configuration"
    steps:
      - step: "Search for existing account type"
        action: "search"
        model: "account.account.type"
        save_as: "account_type"
        domain:
          - - "type"
            - "="
            - "other"
        limit: 1

      - step: "Create account"
        action: "create"
        model: "account.account"
        save_as: "account"
        values:
          name: "Product Config Account"
          code: "999002"
          user_type_id: "EVAL: registry['account_type'].id"

      - step: "Create product usage type"
        action: "create"
        model: "product.usage_type"
        save_as: "usage_type"
        values:
          name: "Usage For Product Config"
          code: "UPRD"
          account_id: "EVAL: registry['account'].id"

      - step: "Create product template"
        action: "create"
        model: "product.template"
        save_as: "product_tmpl"
        values:
          name: "Product Account Config Test"
          type: "consu"

      - step: "Get product variant"
        action: "search"
        model: "product.product"
        save_as: "product"
        domain:
          - - "name"
            - "="
            - "Product Account Config Test"
        limit: 1

      - step: "Create product account configuration"
        action: "create"
        model: "product.account"
        save_as: "prod_account"
        values:
          product_id: "EVAL: registry['product'].id"
          usage_id: "EVAL: registry['usage_type'].id"
          account_id: "EVAL: registry['account'].id"

      - step: "Assert product account configuration created"
        action: "assert"
        target: "prod_account"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          selection_method:
            type: "value"
            expected: "fixed"

