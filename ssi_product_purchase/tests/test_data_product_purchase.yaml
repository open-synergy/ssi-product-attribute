scenarios:
  - name: "Product Purchase Integration - Smoke Test"
    steps:
      - step: "Create product brand"
        action: "create"
        model: "product.brand"
        save_as: "brand"
        values:
          name: "Purchase Test Brand"
          code: "PTB001"

      - step: "Create product template"
        action: "create"
        model: "product.template"
        save_as: "product_tmpl"
        values:
          name: "Purchase Test Product"
          product_brand_id: "EVAL: registry['brand'].id"
          type: "consu"
          purchase_ok: true

      - step: "Assert product created with purchase enabled"
        action: "assert"
        target: "product_tmpl"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          purchase_ok:
            type: "value"
            expected: true
          product_brand_id:
            type: "value"
            operator: "is_truthy"
